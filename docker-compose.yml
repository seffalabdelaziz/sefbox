version: '3.9'
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sefbox
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build: ./backend
    environment:
      DATABASE_URL: mysql://root:root@mysql:3306/sefbox
      JWT_ACCESS_SECRET: access-secret
      JWT_REFRESH_SECRET: refresh-secret
      PORT: 3000
    depends_on:
      - mysql
    ports:
      - '3000:3000'

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:3000/api/v1
    depends_on:
      - backend
    ports:
      - '5173:5173'

volumes:
  mysql_data:
